# Tools run from the project environment so hooks, CI and the lockfile agree on versions.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # Too slow for every commit; CI runs it with --hook-stage manual.
      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push, manual]
