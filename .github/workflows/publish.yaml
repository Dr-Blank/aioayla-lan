name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: Dr-Blank/ha-integration-ci/.github/workflows/library-build.yaml@8bb8dd71791ffd3f07acbb90fea6ecbd63a03683 # v1.3.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      python-version: "3.14"

  # PyPI trusted publishing names this workflow file and environment, so the
  # upload cannot move into the shared workflow.
  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aioayla-lan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A manual re-run for a tag whose files already reached PyPI still
          # goes on to create the GitHub release.
          skip-existing: true

  github-release:
    needs: [build, publish]
    permissions:
      contents: write
    uses: Dr-Blank/ha-integration-ci/.github/workflows/github-release.yaml@8bb8dd71791ffd3f07acbb90fea6ecbd63a03683 # v1.3.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      artifact: dist
