name: Test

on:
  workflow_dispatch: ~
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    uses: Dr-Blank/ha-integration-ci/.github/workflows/test.yaml@8bb8dd71791ffd3f07acbb90fea6ecbd63a03683 # v1.3.0
    with:
      python-version: ${{ matrix.python-version }}
